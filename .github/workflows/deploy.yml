name: Publicar la web

# Cada vez que llega un cambio a main, se genera el sitio y se deja terminado
# en la rama `publicado`. De ahí lo recoge Hostinger.
#
# Por qué así y no por FTP: el FTP de Hostinger no responde a las conexiones
# que vienen de los servidores de GitHub. Se intentó sin cifrar y con cifrado,
# y las dos veces murió con "Timeout (control socket)". Invertir la dirección
# —que sea Hostinger quien vaya a buscar los archivos— esquiva el bloqueo,
# porque entonces la llamada la hace el propio servidor de Hostinger.
#
# La rama `publicado` no se edita nunca a mano: se reescribe entera en cada
# publicación y contiene solo el resultado, con el index.html en su raíz.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para que el robot pueda escribir en la rama `publicado`.
permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # Ubuntu ya trae Python 3, y construir.py no usa ninguna librería
      # externa a propósito, así que no hay nada que instalar.
      - name: Generar el sitio
        run: python3 construir.py

      - name: Dejar el resultado en la rama publicado
        run: |
          cd publico
          git init -q -b publicado
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web generada desde ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            publicado
          echo "Publicadas $(git ls-files | wc -l) páginas y archivos en la rama publicado."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
